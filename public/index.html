<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sprout</title>
    <meta name="description" content="Sprout — clean, modern news with AI summaries." />
    <meta name="theme-color" content="#0a0c0b" id="theme-color" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sprout" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/fonts/geist-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand" data-link aria-label="Sprout home">
          <img src="/img/logo.png" alt="" width="28" height="32" />
          <span>Sprout</span>
        </a>
        <nav class="header-actions" aria-label="Primary">
          <a href="/search" class="icon-btn" data-link aria-label="Search" title="Search" data-icon="search"></a>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
          <div id="account-slot"></div>
        </nav>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <span class="brand brand-sm"><img src="/img/logo.png" alt="" width="18" height="20" /> Sprout</span>
        <span class="muted">News, freshly grown.</span>
      </div>
    </footer>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
